openapi: 3.2.0
info:
  title: Cognee Settings API
  description: Cognee API with Bearer token and Cookie auth
  version: 1.0.0
servers:
- url: https://{tenant}.aws.cognee.ai
  description: 'Cognee Cloud: your tenant pod, named in the platform.cognee.ai dashboard'
  variables:
    tenant:
      default: your-tenant
      description: Your tenant name, shown in the Cognee Cloud dashboard
- url: http://localhost:8000
  description: 'Self-hosted: a locally running cognee server'
security:
- BearerAuth: []
- ApiKeyAuth: []
tags:
- name: Settings
  description: Configuration endpoints for managing Cognee settings.
paths:
  /api/v1/settings:
    get:
      tags:
      - Settings
      summary: Get Settings
      description: 'Get the current system settings.


        This endpoint retrieves the current configuration settings for the system,

        including LLM (Large Language Model) configuration and vector database

        configuration. These settings determine how the system processes and stores data.


        ## Response

        Returns the current system settings containing:

        - **llm**: LLM configuration (provider, model, API key)

        - **vector_db**: Vector database configuration (provider, URL, API key)


        ## Error Codes

        - **500 Internal Server Error**: Error retrieving settings'
      operationId: get_settings_api_v1_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsDTO'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
    post:
      tags:
      - Settings
      summary: Save Settings
      description: 'Save or update system settings.


        This endpoint allows updating the system configuration settings. You can

        update either the LLM configuration, vector database configuration, or both.

        Only provided settings will be updated; others remain unchanged.


        ## Request Parameters

        - **llm** (Optional[LLMConfigInputDTO]): LLM configuration (provider, model, API key)

        - **vector_db** (Optional[VectorDBConfigInputDTO]): Vector database configuration (provider, URL, API key)


        ## Response

        No content returned on successful save.


        ## Error Codes

        - **403 Forbidden**: Caller is not a superuser

        - **400 Bad Request**: Invalid settings provided

        - **500 Internal Server Error**: Error saving settings'
      operationId: save_settings_api_v1_settings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPayloadDTO'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
components:
  schemas:
    ConfigChoice:
      properties:
        value:
          type: string
          title: Value
        label:
          type: string
          title: Label
      type: object
      required:
      - value
      - label
      title: ConfigChoice
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SettingsDTO:
      properties:
        llm:
          $ref: '#/components/schemas/LLMConfigOutputDTO'
        vectorDb:
          $ref: '#/components/schemas/VectorDBConfigOutputDTO'
      type: object
      required:
      - llm
      - vectorDb
      title: SettingsDTO
    SettingsPayloadDTO:
      properties:
        llm:
          anyOf:
          - $ref: '#/components/schemas/LLMConfigInputDTO'
          - type: 'null'
        vectorDb:
          anyOf:
          - $ref: '#/components/schemas/VectorDBConfigInputDTO'
          - type: 'null'
      type: object
      title: SettingsPayloadDTO
    VectorDBConfigOutputDTO:
      properties:
        apiKey:
          type: string
          title: Apikey
        url:
          type: string
          title: Url
        provider:
          type: string
          title: Provider
        providers:
          items:
            $ref: '#/components/schemas/ConfigChoice'
          type: array
          title: Providers
      type: object
      required:
      - apiKey
      - url
      - provider
      - providers
      title: VectorDBConfigOutputDTO
    LLMConfigInputDTO:
      properties:
        provider:
          type: string
          enum:
          - openai
          - ollama
          - anthropic
          - gemini
          - mistral
          title: Provider
        model:
          type: string
          title: Model
        apiKey:
          type: string
          title: Apikey
      type: object
      required:
      - provider
      - model
      - apiKey
      title: LLMConfigInputDTO
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VectorDBConfigInputDTO:
      properties:
        provider:
          type: string
          enum:
          - lancedb
          - pgvector
          title: Provider
        url:
          type: string
          title: Url
        apiKey:
          type: string
          title: Apikey
      type: object
      required:
      - provider
      - url
      - apiKey
      title: VectorDBConfigInputDTO
    LLMConfigOutputDTO:
      properties:
        apiKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Apikey
        model:
          type: string
          title: Model
        provider:
          type: string
          title: Provider
        endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoint
        apiVersion:
          anyOf:
          - type: string
          - type: 'null'
          title: Apiversion
        models:
          additionalProperties:
            items:
              $ref: '#/components/schemas/ConfigChoice'
            type: array
          type: object
          title: Models
        providers:
          items:
            $ref: '#/components/schemas/ConfigChoice'
          type: array
          title: Providers
      type: object
      required:
      - apiKey
      - model
      - provider
      - endpoint
      - apiVersion
      - models
      - providers
      title: LLMConfigOutputDTO
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
